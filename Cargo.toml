[workspace]
resolver = "2"
members = [
    "crates/pty-daemon",
    "crates/shell-parser",
    "crates/daimon-cli",
    "crates/daimon-complete",
    "crates/win-backdrop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
